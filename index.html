
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Site do Bruno</title>

    <style>
        body {
            background-color: #000;
            color: #d0d0d0;
            font-family: monospace;
            font-size: 17px;
            line-height: 1.7;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        a {
            color: #70d957;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        nav {
            border-top: 1px dashed #aaa;
            border-bottom: 1px dashed #aaa;
            padding: 15px 0;
            margin-bottom: 40px;
        }

        h1, h2 {
            color: #fff;
            font-size: 1.1em;
        }

        .profile {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .profile img {
            width: 190px;
            max-width: 100%;
        }

        .section {
            margin-top: 45px;
        }

        @media (max-width: 600px) {
            body {
                margin: 10px;
                padding: 15px;
            }

            .profile {
                gap: 15px;
            }
        }
    </style>
</head>
